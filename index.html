<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F1 - Archivo de Temporadas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>F1 - Archivo de Temporadas 🏁</h1>
    <nav>
      <button data-seccion="calendario">Calendario</button>
      <button data-seccion="resultados">Resultados</button>
      <button data-seccion="posiciones">Posiciones</button>
      <button data-seccion="clasificacion">Clasificación</button>
    </nav>
    <div style="text-align: center; margin: 10px;">
      <label for="temporadaSelector">Temporada:</label>
      <select id="temporadaSelector">
        <option value="2025" selected>2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
      </select>
    </div>
    <div style="text-align: center; margin: 10px;">
      <a href="carreras_2024.zip" download class="descarga-btn">📥 Descargar 10 Carreras en Español (2024)</a>
    </div>
  </header>
  
  <main>
    <div id="calendario" class="seccion activa"></div>
    <div id="resultados" class="seccion"></div>
    <div id="posiciones" class="seccion"></div>
    <div id="clasificacion" class="seccion">
      <div style="margin-bottom: 10px;">
        <label for="selectorCarreraClasificacion">Selecciona carrera:</label>
        <select id="selectorCarreraClasificacion"></select>
      </div>
      <div id="tablaClasificacion"></div>
    </div>
  </main>
  
  <footer>
    <p>Hecho con pasión por la F1 ❤️</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
